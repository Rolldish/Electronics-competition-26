<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#343a40"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #343a40; stroke-width: 3; }
      .wire { fill: none; stroke: #343a40; stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 32px; font-weight: 600; fill: #2f3438; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 25px; fill: #343a40; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 19px; fill: #50565b; }
      .edge-label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 18px; fill: #343a40; paint-order: stroke; stroke: #ffffff; stroke-width: 7px; }
    </style>
  </defs>

  <rect width="1600" height="780" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">MSPM0G3507 小车循迹部分电路框图</text>

  <!-- Power -->
  <rect x="650" y="85" width="310" height="105" class="box"/>
  <text x="805" y="148" text-anchor="middle" class="label">电源模块</text>

  <!-- TB6612 -->
  <rect x="90" y="225" width="350" height="120" class="box"/>
  <text x="265" y="275" text-anchor="middle" class="label">TB6612FNG</text>
  <text x="265" y="313" text-anchor="middle" class="label">双路电机驱动模块</text>

  <!-- Motors -->
  <rect x="90" y="535" width="350" height="145" class="box"/>
  <text x="265" y="585" text-anchor="middle" class="label">左、右直流减速电机</text>
  <text x="265" y="625" text-anchor="middle" class="label">（带编码器）</text>
  <text x="265" y="659" text-anchor="middle" class="small">双轮差速驱动</text>

  <!-- MCU -->
  <rect x="620" y="255" width="430" height="150" class="box"/>
  <text x="835" y="317" text-anchor="middle" class="label">主控核心板</text>
  <text x="835" y="360" text-anchor="middle" class="label">MSPM0G3507（C07A）</text>

  <!-- Infrared tracking sensor -->
  <rect x="650" y="565" width="370" height="135" class="box"/>
  <text x="835" y="620" text-anchor="middle" class="label">红外传感循迹模块</text>
  <text x="835" y="661" text-anchor="middle" class="small">红外反射检测 · 循迹信号输出</text>

  <!-- Buttons -->
  <rect x="1240" y="235" width="250" height="105" class="box"/>
  <text x="1365" y="299" text-anchor="middle" class="label">按键模块</text>

  <!-- OLED -->
  <rect x="1240" y="465" width="250" height="105" class="box"/>
  <text x="1365" y="529" text-anchor="middle" class="label">OLED 显示屏</text>

  <!-- Power distribution -->
  <path class="wire" d="M650 130 H265 V225"/>
  <path class="wire" d="M805 190 V255"/>

  <!-- MCU to motor driver -->
  <path class="wire" d="M620 295 H440"/>
  <text x="530" y="282" text-anchor="middle" class="edge-label">PWM + 方向</text>

  <!-- Driver to motors -->
  <path class="wire" d="M265 345 V535"/>
  <text x="283" y="447" class="edge-label">双路驱动输出</text>

  <!-- Encoder feedback -->
  <path class="wire" d="M440 610 H535 V365 H620"/>
  <text x="520" y="502" text-anchor="end" class="edge-label">编码器反馈</text>

  <!-- Infrared tracking signal -->
  <path class="wire" d="M905 565 V405"/>
  <text x="923" y="494" class="edge-label">循迹检测信号</text>

  <!-- Buttons and display -->
  <path class="wire" d="M1240 287 H1050"/>
  <text x="1145" y="274" text-anchor="middle" class="edge-label">模式 / 启停输入</text>
  <path class="wire" d="M1050 350 H1150 V518 H1240"/>
  <text x="1164" y="435" class="edge-label">显示数据</text>

</svg>
