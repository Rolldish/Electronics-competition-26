<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#315c80"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7b8794"/>
    </marker>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 36px; font-weight: 700; fill: #17324d; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 18px; fill: #64748b; }
      .head { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 25px; font-weight: 700; fill: #19324a; }
      .body { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 18px; fill: #31465a; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 16px; fill: #4b6073; }
      .pin { font-family: Consolas, "Microsoft YaHei", monospace; font-size: 17px; fill: #23445e; }
      .edge { fill: none; stroke: #315c80; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .edge2 { fill: none; stroke: #315c80; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .inactive { fill: none; stroke: #7b8794; stroke-width: 3.5; stroke-dasharray: 12 9; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGray); }
      .edge-label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 17px; font-weight: 600; fill: #315c80; paint-order: stroke; stroke: #ffffff; stroke-width: 7px; stroke-linejoin: round; }
      .inactive-label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 16px; font-weight: 600; fill: #687583; paint-order: stroke; stroke: #ffffff; stroke-width: 7px; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#f8fafc"/>
  <text x="900" y="55" text-anchor="middle" class="title">MSPM0G3507 小车工程硬件连接框图</text>
  <text x="900" y="86" text-anchor="middle" class="subtitle">依据 C07A 核心板原理图、gpio_toggle_output.syscfg 与驱动源码交叉还原 · 2026-07-31</text>

  <!-- C07A core board power and download -->
  <g filter="url(#shadow)">
    <rect x="405" y="108" width="990" height="164" rx="18" fill="#edf8f2" stroke="#3d8964" stroke-width="4"/>
    <text x="900" y="145" text-anchor="middle" class="head">C07A 核心板板载电源与下载（原理图确认）</text>
    <text x="900" y="180" text-anchor="middle" class="body">Type-C 5V → RT9013-33GB LDO → 3V3 → 滤波隔离 → 3V3MCU</text>
    <text x="900" y="211" text-anchor="middle" class="body">USB D+/D− → CH9102F → UART0 PA10/PA11；另有 SWD PA19/PA20</text>
    <text x="900" y="245" text-anchor="middle" class="small" fill="#b33b2e">一致性警告：原理图为 48Pin/SP，工程 SysConfig 配置为 LQFP-64(PM)，需在烧录前核实</text>
  </g>

  <!-- MCU -->
  <g filter="url(#shadow)">
    <rect x="615" y="305" width="570" height="335" rx="24" fill="#e8f3fb" stroke="#315c80" stroke-width="4"/>
    <rect x="615" y="305" width="570" height="72" rx="24" fill="#d6eaf7"/>
    <path d="M615 353 Q615 377 639 377 H1161 Q1185 377 1185 353" fill="#d6eaf7"/>
    <text x="900" y="350" text-anchor="middle" class="head">主控：C07A / MSPM0G3507</text>
    <text x="900" y="405" text-anchor="middle" class="body">TIMA0：10 ms 控制中断 · TIMA1：双路 PWM</text>
    <text x="900" y="438" text-anchor="middle" class="body">ADC0：灰度模拟采样 · GPIO：方向/编码器/按键/OLED</text>
    <text x="900" y="471" text-anchor="middle" class="body">UART1 + DMA_CH0：JY61P 接口（当前业务接收停用）</text>
    <line x1="655" y1="496" x2="1145" y2="496" stroke="#9bb9cf" stroke-width="2"/>
    <text x="645" y="529" class="pin">H2驱动: PB2/3, PA14/13, PA16/17</text>
    <text x="645" y="560" class="pin">编码反馈: H1 PA25/26 · H2 PB20/24</text>
    <text x="645" y="591" class="pin">灰度(H1): PA8/9/24 + PA27</text>
    <text x="965" y="529" class="pin">OLED(J5): PB14/15, PA28/31</text>
    <text x="965" y="560" class="pin">UART1(H2): PB6/PB7</text>
    <text x="965" y="591" class="pin">USB UART0: PA10/PA11</text>
  </g>

  <!-- Gray sensor -->
  <g filter="url(#shadow)">
    <rect x="55" y="245" width="405" height="210" rx="22" fill="#ecf8f1" stroke="#3d8964" stroke-width="4"/>
    <text x="258" y="287" text-anchor="middle" class="head">8 路模拟灰度循迹模块（H1）</text>
    <text x="258" y="325" text-anchor="middle" class="body">无 MCU · 3 位地址选通 + 1 路模拟输出</text>
    <text x="85" y="363" class="pin">A0 / A1 / A2 ← PA8 / PA9 / PA24</text>
    <text x="85" y="397" class="pin">ANALOG OUT → PA27 / ADC0</text>
    <text x="85" y="430" class="small">软件轮询 8 通道，每通道 8 次均值采样</text>
  </g>

  <!-- Buttons -->
  <g filter="url(#shadow)">
    <rect x="55" y="510" width="405" height="210" rx="22" fill="#f3eefb" stroke="#7755a6" stroke-width="4"/>
    <text x="258" y="551" text-anchor="middle" class="head">按键 / 模式输入</text>
    <text x="82" y="594" class="pin">PA12 / H1-9  MODE（外接，中断）</text>
    <text x="82" y="631" class="pin">PB17 / H1-7  BUTTON（外接，中断）</text>
    <text x="82" y="668" class="pin">PB8 / 板载SW1  BUTTON_CNT（轮询）</text>
    <text x="82" y="701" class="small">代码均按上拉、按下为低；板载 BLS 键 PA18 未使用</text>
  </g>

  <!-- OLED -->
  <g filter="url(#shadow)">
    <rect x="1340" y="245" width="405" height="210" rx="22" fill="#f3eefb" stroke="#7755a6" stroke-width="4"/>
    <text x="1543" y="287" text-anchor="middle" class="head">OLED 显示屏（C07A J5）</text>
    <text x="1370" y="332" class="pin">RST  ← PB14</text>
    <text x="1370" y="366" class="pin">DC   ← PB15</text>
    <text x="1370" y="400" class="pin">SCL  ← PA28</text>
    <text x="1370" y="434" class="pin">SDA  ← PA31</text>
  </g>

  <!-- JY61P -->
  <g filter="url(#shadow)">
    <rect x="1340" y="510" width="405" height="210" rx="22" fill="#f3f5f7" stroke="#7b8794" stroke-width="3.5" stroke-dasharray="12 9"/>
    <text x="1543" y="551" text-anchor="middle" class="head" fill="#596673">JY61P 姿态传感器接口（H2）</text>
    <text x="1370" y="594" class="pin">UART1_TX: PB6 → RX</text>
    <text x="1370" y="631" class="pin">UART1_RX: PB7 ← TX</text>
    <text x="1370" y="668" class="body">115200 bit/s · DMA RX 66 Byte</text>
    <text x="1370" y="701" class="small">SysConfig 已配置；DMA 启动和解析代码已注释</text>
  </g>

  <!-- Motor driver -->
  <g filter="url(#shadow)">
    <rect x="595" y="770" width="610" height="188" rx="24" fill="#fff3e8" stroke="#ca6f2b" stroke-width="4"/>
    <text x="900" y="813" text-anchor="middle" class="head">双路 H 桥直流电机驱动（外接 H2，型号待确认）</text>
    <text x="630" y="857" class="pin">A通道: PWMA PB2 + AIN1 PA14 + AIN2 PA13</text>
    <text x="630" y="895" class="pin">B通道: PWMB PB3 + BIN1 PA16 + BIN2 PA17</text>
    <text x="630" y="925" class="small">PWM 计数周期 8000；代码未出现独立 STBY/EN 控制引脚</text>
    <text x="630" y="950" class="small">电机电源和驱动具体型号需由底盘原理图或实物接线确认</text>
  </g>

  <!-- Motors -->
  <g filter="url(#shadow)">
    <rect x="80" y="860" width="430" height="190" rx="22" fill="#eef7fa" stroke="#39788d" stroke-width="4"/>
    <text x="295" y="903" text-anchor="middle" class="head">左直流减速电机 + 正交编码器</text>
    <text x="110" y="949" class="body">驱动输出：A通道</text>
    <text x="110" y="985" class="pin">编码器 E1A → PA25</text>
    <text x="110" y="1020" class="pin">编码器 E1B → PA26</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1290" y="860" width="430" height="190" rx="22" fill="#eef7fa" stroke="#39788d" stroke-width="4"/>
    <text x="1505" y="903" text-anchor="middle" class="head">右直流减速电机 + 正交编码器</text>
    <text x="1320" y="949" class="body">驱动输出：B通道</text>
    <text x="1320" y="985" class="pin">编码器 E2A → PB20</text>
    <text x="1320" y="1020" class="pin">编码器 E2B → PB24</text>
  </g>

  <!-- Active signal paths -->
  <path class="edge" d="M900 272 V305"/>
  <path class="edge" d="M615 392 H535 V330 H460"/>
  <text x="530" y="316" text-anchor="middle" class="edge-label">地址选通</text>
  <path class="edge" d="M460 410 H535 V455 H615"/>
  <text x="535" y="480" text-anchor="middle" class="edge-label">模拟采样</text>

  <path class="edge" d="M460 615 H555 V565 H615"/>
  <text x="535" y="603" text-anchor="middle" class="edge-label">按键状态</text>

  <path class="edge" d="M1185 385 H1270 V350 H1340"/>
  <text x="1262" y="335" text-anchor="middle" class="edge-label">显示数据</text>

  <path class="inactive" d="M1185 545 H1265 V592 H1340"/>
  <path class="inactive" d="M1340 650 H1265 V610 H1185"/>
  <text x="1262" y="674" text-anchor="middle" class="inactive-label">UART（当前未参与控制）</text>

  <path class="edge" d="M900 640 V770"/>
  <text x="915" y="713" class="edge-label">PWM + 方向</text>

  <path class="edge" d="M595 875 H540 V925 H510"/>
  <text x="545" y="850" text-anchor="middle" class="edge-label">A输出</text>
  <path class="edge" d="M1205 875 H1260 V925 H1290"/>
  <text x="1255" y="850" text-anchor="middle" class="edge-label">B输出</text>

  <!-- Encoder feedback paths routed around the driver -->
  <path class="edge2" d="M295 860 V785 H520 V615 H615"/>
  <text x="425" y="770" text-anchor="middle" class="edge-label">左编码器反馈</text>
  <path class="edge2" d="M1505 860 V785 H1280 V615 H1185"/>
  <text x="1375" y="770" text-anchor="middle" class="edge-label">右编码器反馈</text>

  <!-- Legend -->
  <g>
    <line x1="655" y1="1084" x2="730" y2="1084" stroke="#315c80" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <text x="748" y="1090" class="small">当前代码使用</text>
    <line x1="900" y1="1084" x2="975" y2="1084" stroke="#7b8794" stroke-width="3.5" stroke-dasharray="12 9" marker-end="url(#arrowGray)"/>
    <text x="993" y="1090" class="small">已配置但停用</text>
  </g>
</svg>
